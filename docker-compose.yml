# Local stack (NFR-17): Postgres, Kafka (KRaft), Kafka UI, API, notifier and frontend.
#   cp .env.example .env    # optional: add RESEND_API_KEY to send real email
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8080   Kafka UI: http://localhost:8090

name: plms

x-backend-env: &backend-env
  APP_ENV: local
  DATABASE_URL: postgres://plms:plms@postgres:5432/plms?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  KAFKA_REPLICATION_FACTOR: "1"
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
  CODE_HASH_SECRET: ${CODE_HASH_SECRET:-local-dev-code-secret-change-me}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  DEV_EXPOSE_CODES: ${DEV_EXPOSE_CODES:-true}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-PLMS <onboarding@resend.dev>}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plms
      POSTGRES_PASSWORD: plms
      POSTGRES_DB: plms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plms -d plms"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    ports: ["9094:9094"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: plms-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8090:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  api:
    build: { context: ./backend, target: api }
    environment:
      <<: *backend-env
      HTTP_ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SIMULATOR_ENABLED: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@plms.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin12345}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  notifier:
    build: { context: ./backend, target: notifier }
    environment:
      <<: *backend-env
      NOTIFIER_HTTP_ADDR: :8081
    ports: ["8081:8081"]
    depends_on:
      api: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:
    build: { context: ./frontend }
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  kafkadata:
