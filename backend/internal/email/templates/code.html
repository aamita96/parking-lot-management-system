{{define "content"}}
<h1 style="margin:0 0 8px;font-size:20px;">{{.Heading}}</h1>
<p style="margin:0 0 20px;color:#334155;font-size:15px;line-height:22px;">{{.Intro}}</p>
<div style="text-align:center;margin:0 0 20px;">
  <span style="display:inline-block;letter-spacing:10px;font-size:34px;font-weight:800;font-family:'SFMono-Regular',Consolas,monospace;background:#eff6ff;color:#1e40af;padding:14px 22px;border-radius:10px;border:1px solid #bfdbfe;">{{.Code}}</span>
  <p style="margin:10px 0 0;color:#64748b;font-size:13px;">Valid for {{.ValidMinutes}} minutes.</p>
</div>
{{if .VehicleNumber}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e2e8f0;">
  {{template "row" (row "Vehicle being registered" .VehicleLine)}}
</table>
{{end}}
<p style="margin:20px 0 0;color:#64748b;font-size:13px;line-height:20px;">{{.SafetyLine}}</p>
{{end}}
