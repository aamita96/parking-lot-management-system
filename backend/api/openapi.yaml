openapi: 3.1.0
info:
  title: Parking Lot Management System API
  version: 1.0.0
  description: |
    PLMS REST API (SRS section 7). All paths are under `/api/v1`. Errors use RFC 9457 Problem
    Details (`application/problem+json`) with a stable `code` field.

    Callers:
    - **Owners** — `Authorization: Bearer <ownerToken>` from an email code (30 days).
    - **Gate devices** — `X-Gate-Key: <device key>`.
    - **Simulator** — admin bearer token plus `X-Gate-Id: SIM-IN | SIM-OUT` (only when `SIMULATOR_ENABLED=true`).
    - **Admins** — `Authorization: Bearer <accessToken>` (15 min) with an HttpOnly refresh cookie (7 days).

    All `/gate/*` calls accept an `Idempotency-Key` header; a repeated key within 24 hours returns the first response.
servers:
  - url: /api/v1
tags:
  - name: public
  - name: owner
  - name: gate
  - name: admin
  - name: simulator

paths:
  /availability:
    get:
      tags: [public]
      summary: Open spots per panel (FR-10 to FR-13)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
  /public/config:
    get:
      tags: [public]
      summary: Feature flags the frontend needs
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicConfig' } } } }
  /public/registrations:
    post:
      tags: [public]
      summary: Start a registration; emails a 6-digit code (FR-1 to FR-5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleInput' } } } }
      responses:
        '202': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResult' } } } }
        '200': { description: Already registered to this owner, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public/registrations/{id}/verify:
    post:
      tags: [public]
      summary: Check the code; activates the vehicle and returns an owner token
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CodeInput' } } } }
      responses:
        '200': { description: Verified, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /public/registrations/{id}/resend:
    post:
      tags: [public]
      summary: Send a new code for a pending registration
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResult' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /public/sign-in:
    post:
      tags: [public]
      summary: Email a sign-in code to a returning owner (FR-7)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailInput' } } } }
      responses:
        '202': { description: Code sent if the email is registered, content: { application/json: { schema: { $ref: '#/components/schemas/CodeStart' } } } }
  /public/sign-in/verify:
    post:
      tags: [public]
      summary: Exchange a sign-in code for an owner token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CodeInput' } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /public/disputes:
    post:
      tags: [public]
      summary: Report a number registered by someone else (FR-5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeInput' } } } }
      responses:
        '201': { description: Dispute opened, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeResult' } } } }
  /public/vehicles/{number}/check:
    get:
      tags: [public]
      summary: Whether a number is valid and already registered (debounced form check)
      parameters: [{ name: number, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NumberCheck' } } } }

  /me:
    get:
      tags: [owner]
      security: [{ ownerToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerView' } } } }
    patch:
      tags: [owner]
      security: [{ ownerToken: [] }]
      summary: Edit mobile number
      requestBody: { content: { application/json: { schema: { type: object, properties: { mobile: { type: [string, 'null'] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerView' } } } }
  /me/token/refresh:
    post:
      tags: [owner]
      security: [{ ownerToken: [] }]
      responses:
        '200': { description: New token, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
  /me/email-change:
    post:
      tags: [owner]
      security: [{ ownerToken: [] }]
      summary: Send a code to the new email (FR-7)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailInput' } } } }
      responses:
        '202': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/CodeStart' } } } }
  /me/email-change/verify:
    post:
      tags: [owner]
      security: [{ ownerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CodeInput' } } } }
      responses:
        '200': { description: Email changed, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
  /me/vehicles:
    get:
      tags: [owner]
      security: [{ ownerToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MyVehicle' } } } } } } }
    post:
      tags: [owner]
      security: [{ ownerToken: [] }]
      summary: Add a vehicle without a new code (FR-6)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MyVehicle' } } } }
        '200': { description: Already yours, content: { application/json: { schema: { $ref: '#/components/schemas/MyVehicle' } } } }
  /me/vehicles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [owner]
      security: [{ ownerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VehiclePatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyVehicle' } } } }
    delete:
      tags: [owner]
      security: [{ ownerToken: [] }]
      summary: Remove a vehicle that is not parked (FR-8)
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Problem' }
  /me/tickets:
    get:
      tags: [owner]
      security: [{ ownerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TicketPage' } } } }

  /gate/entry-scans:
    post:
      tags: [gate]
      security: [{ gateKey: [] }, { adminToken: [], gateId: [] }]
      summary: Plate read at the IN gate (FR-14 to FR-19)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlateInput' } } } }
      responses:
        '201': { description: Admitted, content: { application/json: { schema: { $ref: '#/components/schemas/EntryResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /gate/exit-scans:
    post:
      tags: [gate]
      security: [{ gateKey: [] }, { adminToken: [], gateId: [] }]
      summary: Plate read at the PAY kiosk; locks the fee (FR-21)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExitInput' } } } }
      responses:
        '200': { description: Fee locked or closed, content: { application/json: { schema: { $ref: '#/components/schemas/ExitResponse' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /gate/payments:
    post:
      tags: [gate]
      security: [{ gateKey: [] }, { adminToken: [], gateId: [] }]
      summary: Record a simulated payment; closes the ticket (FR-23, FR-26)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentInput' } } } }
      responses:
        '200': { description: Paid, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/auth/login:
    post:
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLogin' } } } }
      responses:
        '200': { description: Signed in; sets the refresh cookie, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSession' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/auth/refresh:
    post:
      tags: [admin]
      summary: New access token from the HttpOnly refresh cookie
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSession' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/auth/logout:
    post:
      tags: [admin]
      responses: { '204': { description: Cookie cleared } }
  /admin/simulator/layout:
    get:
      tags: [simulator]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Layout' } } } }
  /admin/simulator/events:
    get:
      tags: [simulator]
      security: [{ adminToken: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 20 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EventSummary' } } } } } } }
  /admin/simulator/reset:
    post:
      tags: [simulator]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [cancelledTickets], properties: { cancelledTickets: { type: integer } } } } } }
  /admin/exceptions:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Exceptions' } } } }
  /admin/exceptions/scans/{id}/resolve:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } } }
      responses: { '200': { description: Resolved } }
  /admin/disputes/{id}/resolve:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } } }
      responses: { '200': { description: Resolved } }
  /admin/tickets:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACTIVE, PAYMENT_PENDING, CLOSED, CANCELLED] } }
        - { name: simulated, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TicketPage' } } } }
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Manual check-in (FR-38)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualCheckIn' } } } }
      responses:
        '201': { description: Ticket opened, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /admin/tickets/{id}:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TicketDetail' } } } }
  /admin/tickets/{id}/manual-exit:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualExit' } } } }
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /admin/tickets/{id}/notifications/{kind}/resend:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Resend the entry or exit email (FR-32)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [entry, exit, ENTRY, EXIT] } }
      responses:
        '202': { description: Re-queued, content: { application/json: { schema: { $ref: '#/components/schemas/EmailNotification' } } } }
  /admin/owners:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerPage' } } } }
  /admin/vehicles:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VehicleStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/VehicleType' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VehiclePage' } } } }
  /admin/vehicles/{id}:
    patch:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Reassign a vehicle to its rightful owner (FR-38)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reassign' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Vehicle' } } } }
  /admin/spots:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Spot' } } } } } } }
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Create one spot or a range of positions (FR-33)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpotInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Spot' } } } } } } }
  /admin/spots/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Out of service / back in service, or change type (FR-34)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpotPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Spot' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Problem' } }
  /admin/pricing:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PricingRule' } } } } } } }
  /admin/pricing/{vehicleType}:
    parameters: [{ name: vehicleType, in: path, required: true, schema: { $ref: '#/components/schemas/VehicleType' } }]
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingView' } } } }
    put:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: New rate card version; applies to tickets opened afterwards (FR-35)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRule' } } } }
  /admin/settings:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /admin/settings/overflow:
    put:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Toggle overflow allocation (FR-36)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, reason: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /admin/gate-devices:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/GateDevice' } } } } } } }
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Register a device; the API key is returned once (FR-37)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GateInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GateWithKey' } } } }
  /admin/gate-devices/{id}:
    patch:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GatePatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GateDevice' } } } }
  /admin/gate-devices/{id}/rotate-key:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: New key (shown once), content: { application/json: { schema: { $ref: '#/components/schemas/GateWithKey' } } } }
  /admin/audit:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
  /healthz:
    get:
      summary: Liveness
      responses: { '200': { description: OK } }
  /readyz:
    get:
      summary: Readiness (database reachable)
      responses: { '200': { description: OK }, '503': { description: Not ready } }

components:
  securitySchemes:
    ownerToken: { type: http, scheme: bearer, bearerFormat: JWT }
    adminToken: { type: http, scheme: bearer, bearerFormat: JWT }
    gateKey: { type: apiKey, in: header, name: X-Gate-Key }
    gateId: { type: apiKey, in: header, name: X-Gate-Id }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 25 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 100 } }
  responses:
    Problem:
      description: Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      additionalProperties: true
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [NOT_REGISTERED, NO_SPOT_AVAILABLE, VALIDATION_ERROR] }
        detail: { type: string }
        message: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        result: { type: string, enum: [REJECTED] }
        plate: { type: string }
        registerUrl: { type: string }
        receipt: { $ref: '#/components/schemas/Receipt' }
        attemptsLeft: { type: integer }
        canDispute: { type: boolean }
        feePaise: { type: integer }
    FieldError:
      type: object
      required: [field, message]
      properties: { field: { type: string }, message: { type: string } }

    VehicleType: { type: string, enum: [MOTORCYCLE, CAR, TRUCK] }
    SpotType: { type: string, enum: [COMPACT, REGULAR, OVERSIZED] }
    VehicleStatus: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, REMOVED] }
    SpotStatus: { type: string, enum: [AVAILABLE, OCCUPIED, OUT_OF_SERVICE] }
    TicketStatus: { type: string, enum: [ACTIVE, PAYMENT_PENDING, CLOSED, CANCELLED] }
    GateKind: { type: string, enum: [ENTRY, EXIT] }
    EmailStatus: { type: string, enum: [WAITING, QUEUED, SENT, FAILED, DEFERRED] }

    Rate:
      type: object
      required: [hourlyRatePaise, dailyCapPaise, graceMinutes]
      properties:
        hourlyRatePaise: { type: integer }
        dailyCapPaise: { type: integer }
        graceMinutes: { type: integer }
    Fee:
      type: object
      required: [durationMinutes, billableHours, withinGrace, fullDays, remainderHours, remainderPaise, remainderCapped, feePaise]
      properties:
        durationMinutes: { type: integer }
        billableHours: { type: integer }
        withinGrace: { type: boolean }
        fullDays: { type: integer }
        remainderHours: { type: integer }
        remainderPaise: { type: integer }
